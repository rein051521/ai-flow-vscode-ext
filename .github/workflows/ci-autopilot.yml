name: autopilot-ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node dependencies if package exists
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; fi
          if [ -f yarn.lock ]; then corepack enable && yarn install --immutable; fi

      - name: Install Python tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit

      - name: JavaScript / TypeScript checks
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
            npm run typecheck --if-present
            npm test --if-present
            npm run build --if-present
          fi

      - name: Python ruff (lint only; tests/typecheck delegated to repo CI)
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.venv/*' -not -path './.claude/*' | grep -q .; then
            ruff check . --exclude .claude
          fi

      - name: npm audit (critical only; high handled by dependabot)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm audit --audit-level=critical; fi

      - name: pip-audit
        shell: bash
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; else pip-audit || [ $? -eq 1 ]; fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-pack:
    name: verify-autopilot-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify pack if present
        shell: bash
        run: |
          if [ -f scripts/verify_installed_v4.py ]; then
            python scripts/verify_installed_v4.py
          fi
